name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aiml_ref:
        description: "aiml ref to build against (branch, tag or SHA)"
        default: master
      aiml_quelle:
        description: "aiml: pull from kontor, build, or pull-else-build"
        type: choice
        default: auto
        options: [auto, kontor, bauen]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build chart and run the headless suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXODUS_CACHE: ${{ github.workspace }}/aiml/__exodus_cache
    steps:
      - name: Check out chart
        uses: actions/checkout@v4
        with:
          path: chart

      # Public, so no token: dc_traincorp's workflow checks it out the same way.
      - name: Check out aiml
        uses: actions/checkout@v4
        with:
          repository: Pymann/aiml
          ref: ${{ inputs.aiml_ref || 'master' }}
          path: aiml

      - name: Which aiml commit
        run: echo "AIML_SHA=$(git -C aiml rev-parse HEAD)" >> "$GITHUB_ENV"

      # Missing secrets are not an error: the run then builds aiml itself.
      - name: kontor access
        id: kontor
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.KONTOR_CA }}
        run: |
          set -eu
          mkdir -p tools
          if [ -z "${KONTOR_URL:-}" ] || [ -z "${KONTOR_TOKEN:-}" ] || [ -z "${KONTOR_CA:-}" ]; then
            echo "da=0" >> "$GITHUB_OUTPUT"
            echo "KONTOR_* secrets missing -- aiml will be built."
            exit 0
          fi
          printf '%s\n' "$KONTOR_CA" > tools/kontor-ca.crt
          # No `curl -k`: without certificate checking a man in the middle could
          # take the token.
          echo "kontor: $(curl --silent --show-error --fail-with-body --max-time 60 \
                              --cacert tools/kontor-ca.crt \
                              -H "Authorization: Bearer $KONTOR_TOKEN" \
                              "$KONTOR_URL/api/v1/whoami")"
          echo "da=1" >> "$GITHUB_OUTPUT"

      # The aiml compiler links LLVM 18; building it per run would be the most
      # expensive line here. kontor keeps the finished venv keyed by COMMIT --
      # the GENERIC store, not /exodus/<name>/<version>/package, because aiml
      # carries one version across all commits and each state would overwrite
      # the last. Same key and same layout as dc_traincorp uses, so both repos
      # read and fill one store rather than two.
      - name: Pull aiml from kontor
        id: holen
        if: (inputs.aiml_quelle || 'auto') != 'bauen' && steps.kontor.outputs.da == '1'
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: |
          set -eu
          ziel="$KONTOR_URL/generic/aiml/${AIML_SHA}/aiml-x86_64-linux.tar.gz"
          if curl --silent --show-error --fail --max-time 900 \
                  --cacert tools/kontor-ca.crt \
                  -H "Authorization: Bearer $KONTOR_TOKEN" \
                  -o aiml-paket.tar.gz "$ziel"; then
            mkdir -p aiml-venv
            tar -xzf aiml-paket.tar.gz -C aiml-venv
            rm -f aiml-paket.tar.gz
            # A state from before the bundling does not resolve its pinned
            # libraries: treat that as absent and build instead.
            fehlt="$(ldd aiml-venv/bin/aiml aiml-venv/lib/libaiml.so | grep 'not found' || true)"
            if [ -x aiml-venv/bin/aiml ] && [ -f aiml-venv/lib/libaiml.so ] && [ -z "$fehlt" ]; then
              echo "da=1" >> "$GITHUB_OUTPUT"
              echo "pulled: $ziel"
            else
              echo "pulled but incomplete -- rebuilding:"; echo "$fehlt"
              rm -rf aiml-venv
              echo "da=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "da=0" >> "$GITHUB_OUTPUT"
            echo "${AIML_SHA} is not in kontor -- building it."
          fi

      - name: aiml was required from kontor
        if: (inputs.aiml_quelle || 'auto') == 'kontor' && steps.holen.outputs.da != '1'
        run: |
          echo "aiml_quelle=kontor was asked for, but ${AIML_SHA} could not be pulled."
          exit 1

      # Only the aiml build needs exodus (and Python): `aiml build` covers an aiml
      # TOOL, but exodus is the build system of aiml ITSELF -- 171 pinned apt
      # packages, C++ sources, wasm (aiml spec/68 §7). On the kontor path neither
      # is installed at all.
      - name: Install Exodus (only to build aiml)
        if: steps.holen.outputs.da != '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/exvenv"
          "$RUNNER_TEMP/exvenv/bin/pip" install -q "git+https://github.com/Pymann/exodus.git"
          echo "$RUNNER_TEMP/exvenv/bin" >> "$GITHUB_PATH"

      - name: System packages
        if: steps.holen.outputs.da != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ python3-venv dpkg-dev patchelf \
            xvfb x11-utils libgl1-mesa-dri
          # The display packages come with the aiml build because libaiml links
          # GL: a runtime built without it is useless to the editor stage later.

      - name: Build aiml and bundle it as a venv
        if: steps.holen.outputs.da != '1'
        working-directory: aiml
        run: |
          set -eu
          python3 tools/ci/fetch_pinned_debs.py exodus.json exodus2.json
          exodus pkg install
          exodus build -c exodus.json -j "$(nproc)"
          exodus build -c exodus2.json -j "$(nproc)"
          # The release packaging also bundles the pinned libraries next to
          # libaiml.so with RUNPATH $ORIGIN, so the venv is relocatable -- which
          # is what makes it worth storing at all.
          bash tools/ci/package_release.sh "git-${AIML_SHA::7}" dist
          mkdir -p "$GITHUB_WORKSPACE/aiml-venv"
          tar -xzf dist/aiml-git-*-linux-x86_64.tar.gz \
              -C "$GITHUB_WORKSPACE/aiml-venv" --strip-components=1
          # The venv marker (aiml spec/68 §3 F68-20) -- kept so the blob stays
          # the same shape dc_traincorp reads.
          echo "# aiml venv" > "$GITHUB_WORKSPACE/aiml-venv/env"

      # Filling the store is best effort: a reader-only token must not fail the
      # run, it only means the next run builds again.
      - name: Put aiml into kontor
        if: steps.holen.outputs.da != '1' && steps.kontor.outputs.da == '1'
        continue-on-error: true
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: |
          set -eu
          tar -czf aiml-paket.tar.gz -C aiml-venv bin lib env
          summe=$(sha256sum aiml-paket.tar.gz | cut -d' ' -f1)
          curl --silent --show-error --fail-with-body --max-time 1800 \
               --cacert tools/kontor-ca.crt \
               -H "Authorization: Bearer $KONTOR_TOKEN" \
               -H "X-Checksum-Sha256: $summe" \
               -X PUT -T aiml-paket.tar.gz \
               "$KONTOR_URL/generic/aiml/${AIML_SHA}/aiml-x86_64-linux.tar.gz"
          echo "stored: generic/aiml/${AIML_SHA}/ ($(stat -c%s aiml-paket.tar.gz) B)"
          rm -f aiml-paket.tar.gz

      # exodus-chart.json names the toolchain as $AIML and $AIML_VENV/lib, so one
      # config serves both routes and a workstation (aiml spec/68 §3, F68-23).
      - name: Set the toolchain paths
        run: |
          set -eu
          test -x aiml-venv/bin/aiml
          test -f aiml-venv/lib/libaiml.so
          echo "AIML=$PWD/aiml-venv/bin/aiml" >> "$GITHUB_ENV"
          echo "AIML_VENV=$PWD/aiml-venv" >> "$GITHUB_ENV"

      # The compiler builds the tool itself -- no exodus, no Python (spec/68 §7).
      # chart qualifies: an executable of .aiml sources, no apt/git packages, no
      # hooks, no __exodus_cache path, all of which F68-82 refuses by name.
      - name: Build chart
        working-directory: chart
        run: '"$AIML" build -c exodus-chart.json'

      # Stage 0 is headless on purpose: the emitter is a pure function of the
      # sheet (spec §2), so its suite needs no display. The editor suite will get
      # its OWN step under `xvfb-run -a script -qec ...` -- aiml's CI learned that
      # a display test without a TTY is skipped in silence, and a silent skip
      # reads exactly like a pass.
      - name: Tests
        working-directory: chart
        run: bash tests/run_tests.sh

      - name: Upload produced Mermaid on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chart-test-output
          path: chart/tests/out
          if-no-files-found: ignore
