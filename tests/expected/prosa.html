<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>chart</title>
<style>
  html,body{margin:0;background:#101a24;color:#e8eef4;font:15px/1.5 system-ui,sans-serif}
  .slide{display:none;height:100vh;align-items:center;justify-content:center}
  .slide.on{display:flex}
  svg{max-width:100vw;max-height:100vh;height:auto;width:auto;box-shadow:0 0 40px #0008}
  #count{position:fixed;right:14px;bottom:10px;opacity:.55}
</style>
<div class="slide">
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="52" y="38" font-size="22" fill="#101a24">Was der Scanner tut</text>
  <text x="60" y="105" fill="#1a2430">Er liest Quelldateien und prueft Regeln. Metriken wie McCabe und cloc</text>
  <text x="60" y="127" fill="#1a2430">zaehlen dabei mit.</text>
  <text x="60" y="165" fill="#1a2430">Zwei Absaetze, damit die Trennung sichtbar wird.</text>
  <text x="60" y="203" fill="#1a2430">| Tabelle | bleibt |</text>
  <text x="60" y="225" fill="#1a2430">|---|---|</text>
  <text x="60" y="247" fill="#1a2430">| als | Text |</text>
  <rect x="60" y="290" width="210" height="76" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="165" y="333" fill="#1a2430" text-anchor="middle">Quelle</text>
  <polygon points="487,290 592,328 487,366 382,328" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="487" y="333" fill="#1a2430" text-anchor="middle">Regel trifft?</text>
  <rect x="704" y="290" width="210" height="76" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="809" y="333" fill="#1a2430" text-anchor="middle">Befund</text>
  <line x1="270" y1="328" x2="382" y2="328" stroke="#55687a" stroke-width="2"/>
  <polygon points="382,328 367.3,321.6 367.3,334.4" fill="#55687a"/>
  <line x1="592" y1="328" x2="704" y2="328" stroke="#55687a" stroke-width="2"/>
  <polygon points="704,328 689.3,321.6 689.3,334.4" fill="#55687a"/>
  <text x="648" y="328" text-anchor="middle" font-size="13" fill="none" stroke="#ffffff" stroke-width="3">ja</text>
  <text x="648" y="328" text-anchor="middle" font-size="13" fill="#33404d">ja</text>
</svg>
</div>
<div class="slide">
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="52" y="38" font-size="22" fill="#101a24">Zweite Folie</text>
  <text x="60" y="105" fill="#1a2430">Nur Text, kein Diagramm.</text>
</svg>
</div>
<div id="count"></div>
<script>
const pages=[...document.querySelectorAll('.slide')];
let at=Math.min(Math.max(parseInt(new URLSearchParams(location.search).get('slide')||'1',10)-1,0),pages.length-1);
function show(){pages.forEach((p,i)=>p.classList.toggle('on',i===at));document.getElementById('count').textContent=(at+1)+' / '+pages.length;}
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){at=Math.min(at+1,pages.length-1);show();}if(e.key==='ArrowLeft'||e.key==='PageUp'){at=Math.max(at-1,0);show();}if(e.key==='Home'){at=0;show();}if(e.key==='End'){at=pages.length-1;show();}});
addEventListener('click',()=>{at=Math.min(at+1,pages.length-1);show();});
show();
</script>
</html>
