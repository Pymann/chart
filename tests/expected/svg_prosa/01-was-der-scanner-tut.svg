<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="52" y="38" font-size="22" fill="#101a24">Was der Scanner tut</text>
  <text x="60" y="105" fill="#1a2430">Er liest Quelldateien und prueft Regeln. Metriken wie McCabe und cloc</text>
  <text x="60" y="127" fill="#1a2430">zaehlen dabei mit.</text>
  <text x="60" y="165" fill="#1a2430">Zwei Absaetze, damit die Trennung sichtbar wird.</text>
  <text x="60" y="203" fill="#1a2430">| Tabelle | bleibt |</text>
  <text x="60" y="225" fill="#1a2430">|---|---|</text>
  <text x="60" y="247" fill="#1a2430">| als | Text |</text>
  <rect x="60" y="290" width="210" height="76" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="165" y="333" fill="#1a2430" text-anchor="middle">Quelle</text>
  <polygon points="487,290 592,328 487,366 382,328" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="487" y="333" fill="#1a2430" text-anchor="middle">Regel trifft?</text>
  <rect x="704" y="290" width="210" height="76" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="809" y="333" fill="#1a2430" text-anchor="middle">Befund</text>
