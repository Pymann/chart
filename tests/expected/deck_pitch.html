<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Mitgliedsantrag</title>
<style>
  html,body{margin:0;background:#101a24;color:#e8eef4;font:15px/1.5 system-ui,sans-serif}
  .slide{display:none;height:100vh;align-items:center;justify-content:center}
  .slide.on{display:flex}
  svg{max-width:100vw;max-height:100vh;height:auto;width:auto;box-shadow:0 0 40px #0008}
  #count{position:fixed;right:14px;bottom:10px;opacity:.55}
</style>
<div class="slide">
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="52" y="38" font-size="22" fill="#101a24">Eingang</text>
  <ellipse cx="110" cy="68" rx="70" ry="28" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="110" y="73" fill="#1a2430" text-anchor="middle">Antrag</text>
  <polygon points="120,160 200,205 120,250 40,205" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="120" y="210" fill="#1a2430" text-anchor="middle">vollstaendig?</text>
  <line x1="112" y1="96" x2="116.8" y2="161.8" stroke="#55687a" stroke-width="2"/>
  <polygon points="116.8,161.8 122.2,146.6 109.4,147.6" fill="#55687a"/>
</svg>
</div>
<div class="slide">
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="52" y="38" font-size="22" fill="#101a24">Formular, Seite 1</text>
  <image href="bilder/antrag_s1.png" x="20" y="20" width="400" height="300" preserveAspectRatio="xMidYMid meet"/>
  <rect x="20" y="20" width="400" height="300" fill="none" stroke="#3a4a5a"/>
  <text x="220" y="337" fill="#4a5a6a" text-anchor="middle">Antrag, Seite 1</text>
</svg>
</div>
<div class="slide">
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="120" height="60" fill="#f2f5f9" stroke="#3a4a5a"/>
  <text x="60" y="35" fill="#1a2430" text-anchor="middle">Ende</text>
</svg>
</div>
<div id="count"></div>
<script>
const pages=[...document.querySelectorAll('.slide')];
let at=Math.min(Math.max(parseInt(new URLSearchParams(location.search).get('slide')||'1',10)-1,0),pages.length-1);
function show(){pages.forEach((p,i)=>p.classList.toggle('on',i===at));document.getElementById('count').textContent=(at+1)+' / '+pages.length;}
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){at=Math.min(at+1,pages.length-1);show();}if(e.key==='ArrowLeft'||e.key==='PageUp'){at=Math.max(at-1,0);show();}if(e.key==='Home'){at=0;show();}if(e.key==='End'){at=pages.length-1;show();}});
addEventListener('click',()=>{at=Math.min(at+1,pages.length-1);show();});
show();
</script>
</html>
